{% extends 'base/base.html' %}
{% load static %}

{% block title %}Connexion - SÎKÂ{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="bi bi-box-arrow-in-right"></i> Connexion</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="{{ form.username.id_for_label }}" 
                                   class="form-label">Nom d'utilisateur ou Email</label>
                            {{ form.username }}
                        </div>
                        
                        <div class="mb-3">
                            <label for="{{ form.password.id_for_label }}" 
                                   class="form-label">Mot de passe</label>
                            {{ form.password }}
                        </div>
                        
                        <div class="mb-3">
                            <a href="/password-reset/" class="text-decoration-none">Mot de passe oublié?</a>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-box-arrow-in-right"></i> Se connecter
                            </button>
                        </div>
                    </form>
                    
                    <hr>
                    
                    <div class="text-center">
                        <p class="mb-0">Vous n'avez pas de compte?</p>
                        <a href="{% url 'e_commerce:register' %}" class="btn btn-outline-primary">
                            <i class="bi bi-person-plus"></i> Créer un compte
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
