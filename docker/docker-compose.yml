services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      # Bootstrap/owner role: only used by the api entrypoint to run
      # `migrate` and setup_relational_extras (DDL rights). The running
      # application connects as the restricted commerce_app role instead
      # (created by setup_relational_extras), never with this account.
      POSTGRES_USER: postgres_admin
      POSTGRES_PASSWORD: postgres_admin_pw
      POSTGRES_DB: sika
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_admin -d sika"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: sika
    volumes:
      - mongodata:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ../api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: sika
      POSTGRES_OWNER_USER: postgres_admin
      POSTGRES_OWNER_PASSWORD: postgres_admin_pw
      POSTGRES_APP_USER: commerce_app
      POSTGRES_APP_PASSWORD: commerce_app_pw
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: sika
    volumes:
      - media_data:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8090:8080"
    depends_on:
      - db

  mongo-express:
    image: mongo-express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH: "false"
    ports:
      - "8091:8081"
    depends_on:
      - mongo

volumes:
  pgdata:
  mongodata:
  media_data:
