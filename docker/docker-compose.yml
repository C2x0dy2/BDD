services:
  db:
    image: postgres:16
    restart: unless-stopped
    # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB come from ../.env.
    # This bootstrap/owner role is only used by the api entrypoint to run
    # `migrate` and setup_relational_extras (DDL rights). The running
    # application connects as the restricted commerce_app role instead
    # (created by setup_relational_extras), never with this account.
    env_file:
      - ../.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    restart: unless-stopped
    # MONGO_INITDB_ROOT_USERNAME / MONGO_INITDB_ROOT_PASSWORD from ../.env
    # turn authentication on (the api connects with these credentials).
    env_file:
      - ../.env
    environment:
      MONGO_INITDB_DATABASE: sika
    volumes:
      - mongodata:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ../api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      MONGO_DB_NAME: sika
    volumes:
      - media_data:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8090:8080"
    depends_on:
      - db

  mongo-express:
    image: mongo-express
    restart: unless-stopped
    env_file:
      - ../.env   # ME_CONFIG_MONGODB_URL (with credentials)
    environment:
      ME_CONFIG_BASICAUTH: "false"
    ports:
      - "8091:8081"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  pgdata:
  mongodata:
  media_data:
