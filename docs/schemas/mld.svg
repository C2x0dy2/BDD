<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Arial, sans-serif" font-size="12">
  <rect width="900" height="460" fill="#ffffff"/>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#444"/></marker></defs>
  <style>.t{fill:#e3f2fd;stroke:#1565c0}.h{font-weight:bold}</style>

  <rect class="t" x="20" y="20" width="200" height="120" rx="6"/>
  <text class="h" x="30" y="40">e_commerce_user</text>
  <text x="30" y="60">id (PK)</text><text x="30" y="76">username, email (UNIQUE)</text>
  <text x="30" y="92">is_seller, is_seller_approved</text><text x="30" y="108">first_name, last_name ...</text>

  <rect class="t" x="340" y="20" width="220" height="150" rx="6"/>
  <text class="h" x="350" y="40">e_commerce_product</text>
  <text x="350" y="60">id (PK)</text><text x="350" y="76">name, slug (UNIQUE)</text>
  <text x="350" y="92">price CHECK (&gt;= 0), stock</text><text x="350" y="108">category_id (FK) , seller_id (FK)</text>
  <text x="350" y="124">is_active, created_at</text>

  <rect class="t" x="680" y="20" width="200" height="90" rx="6"/>
  <text class="h" x="690" y="40">e_commerce_category</text>
  <text x="690" y="60">id (PK)</text><text x="690" y="76">name, slug (UNIQUE)</text>

  <rect class="t" x="680" y="150" width="200" height="70" rx="6"/>
  <text class="h" x="690" y="170">e_commerce_tag</text>
  <text x="690" y="190">id (PK), name, slug</text>
  <text x="690" y="206">N-N via product_tags</text>

  <rect class="t" x="20" y="230" width="220" height="140" rx="6"/>
  <text class="h" x="30" y="250">e_commerce_order</text>
  <text x="30" y="270">id (PK), order_number (UNIQUE)</text><text x="30" y="286">user_id (FK)</text>
  <text x="30" y="302">status, payment_status</text><text x="30" y="318">total_amount (trigger)</text>
  <text x="30" y="334">created_at (INDEX)</text>

  <rect class="t" x="340" y="260" width="220" height="100" rx="6"/>
  <text class="h" x="350" y="280">e_commerce_orderitem</text>
  <text x="350" y="300">id (PK)</text><text x="350" y="316">order_id (FK), product_id (FK)</text>
  <text x="350" y="332">quantity CHECK (&gt;= 0), price</text>

  <rect class="t" x="680" y="260" width="200" height="100" rx="6"/>
  <text class="h" x="690" y="280">cart / cartitem / wishlist</text>
  <text x="690" y="300">user_id (FK), product_id (FK)</text>
  <text x="690" y="316">quantity CHECK (&gt;= 0)</text>

  <line x1="340" y1="95" x2="220" y2="75" stroke="#444" marker-end="url(#a)"/><text x="262" y="72">seller</text>
  <line x1="560" y1="70" x2="680" y2="65" stroke="#444" marker-end="url(#a)"/>
  <line x1="560" y1="110" x2="680" y2="170" stroke="#444" marker-end="url(#a)"/>
  <line x1="130" y1="230" x2="130" y2="140" stroke="#444" marker-end="url(#a)"/><text x="138" y="190">client</text>
  <line x1="240" y1="300" x2="340" y2="300" stroke="#444" marker-end="url(#a)"/>
  <line x1="450" y1="260" x2="450" y2="170" stroke="#444" marker-end="url(#a)"/>
  <line x1="680" y1="300" x2="560" y2="150" stroke="#444" stroke-dasharray="4,3" marker-end="url(#a)"/>

  <text x="20" y="420" fill="#555">Vue category_sales_view (jointure category/product/orderitem/order) · trigger recalc_order_total sur orderitem.</text>
  <text x="20" y="438" fill="#555">Flèche = clé étrangère (de la table fille vers la table référencée).</text>
</svg>
