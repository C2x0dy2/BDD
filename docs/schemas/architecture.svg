<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Arial, sans-serif" font-size="13">
  <rect width="760" height="420" fill="#ffffff"/>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#444"/></marker></defs>

  <rect x="230" y="20" width="300" height="50" rx="8" fill="#eef2f7" stroke="#444"/>
  <text x="380" y="42" text-anchor="middle" font-weight="bold">Client</text>
  <text x="380" y="60" text-anchor="middle">navigateur (site HTML) / curl / Postman</text>

  <line x1="380" y1="70" x2="380" y2="112" stroke="#444" marker-end="url(#a)"/>
  <text x="392" y="95">HTTP :8000</text>

  <rect x="190" y="115" width="380" height="120" rx="8" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="380" y="137" text-anchor="middle" font-weight="bold">Django + DRF (conteneur api)</text>
  <text x="380" y="162" text-anchor="middle">e_commerce/ : site HTML, CRUD produits/commandes</text>
  <text x="380" y="182" text-anchor="middle">reviews/ : avis + fiches (pymongo), endpoint croisé</text>
  <text x="380" y="202" text-anchor="middle">reports/ : requêtes SQL avancées (lecture seule)</text>
  <text x="380" y="222" text-anchor="middle">entrypoint : migrate, extras SQL, peuplement</text>

  <line x1="290" y1="235" x2="170" y2="290" stroke="#444" marker-end="url(#a)"/>
  <text x="120" y="268">ORM / SQL</text>
  <text x="120" y="283">rôle commerce_app</text>
  <line x1="470" y1="235" x2="590" y2="290" stroke="#444" marker-end="url(#a)"/>
  <text x="520" y="268">pymongo</text>
  <text x="520" y="283">(authentifié)</text>

  <rect x="40" y="295" width="260" height="105" rx="8" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="170" y="317" text-anchor="middle" font-weight="bold">PostgreSQL 16 (db)</text>
  <text x="170" y="340" text-anchor="middle">source de vérité : users, catégories,</text>
  <text x="170" y="358" text-anchor="middle">produits, panier, commandes</text>
  <text x="170" y="378" text-anchor="middle">vue + index + trigger + CHECK</text>

  <rect x="460" y="295" width="260" height="105" rx="8" fill="#fff3e0" stroke="#e65100"/>
  <text x="590" y="317" text-anchor="middle" font-weight="bold">MongoDB 7 (mongo)</text>
  <text x="590" y="340" text-anchor="middle">product_specs (attributs variables)</text>
  <text x="590" y="358" text-anchor="middle">reviews (avis + réponses embarquées)</text>
  <text x="590" y="378" text-anchor="middle">liés par product_id / user_id</text>

  <line x1="300" y1="347" x2="460" y2="347" stroke="#888" stroke-dasharray="5,4"/>
  <text x="380" y="340" text-anchor="middle" fill="#666">identifiants partagés</text>
  <text x="380" y="365" text-anchor="middle" fill="#666">(pas de FK native)</text>
</svg>
